[workspace]
authors = ["Alex Sopio <alexander.linus.sopio@cern.ch>"]
channels = ["conda-forge"]
name = "llm_doc_converter_training"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
scripts = ["activation/set_hf_home.sh"]

[dependencies]
python = "==3.13"
poppler = ">=26.7.0,<27"
qpdf = ">=12.3.2,<13"

[pypi-dependencies]
pillow = ">=10.0.1, <=15.0"
torch = "==2.8.0"
torchvision = "==0.23.0"
transformers = "==5.15.0"
peft = ">=0.18, <0.19"
bitsandbytes = ">=0.47, <0.48"
trackio = ">=0.6, <1"
accelerate = ">=1.10.1, <2"
vortex-data = ">=0.84.0, <0.85"
pyarrow = ">=25.0.1, <26"
datasets = ">=4.0, <5"
nvidia-modelopt = { version = ">=0.44, <0.45", extras = ["hf"] }
